<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Op-Sym</title>
  <meta name="application-name" content="Op-Sym">
  <meta name="apple-mobile-web-app-title" content="Op-Sym">
  <meta name="theme-color" content="#0F52FF">
  <meta name="description" content="Op-Sym - Plan · Focus · Get things done">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="96x96" href="./favicon-96.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    :root{--blue:#0F52FF;--sky:#0EA5FF;--teal:#14D8C4;--cream:#FFE3B0;--navy:#0B1A3C;--slate:#64748B;--pale:#EAF2FF}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff;color:var(--navy)}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;background:
      radial-gradient(circle at 16% 10%,rgba(14,165,255,.14),transparent 34%),
      radial-gradient(circle at 88% 80%,rgba(20,216,196,.10),transparent 32%),#fff}
    .shell{width:min(520px,100%);text-align:center}
    .logo{width:124px;height:124px;object-fit:contain}
    h1{font-size:40px;letter-spacing:-.04em;margin:14px 0 4px}
    .tag{font-size:14px;color:var(--slate);margin-bottom:24px}
    .card{padding:22px;border:1px solid #dce7f5;border-radius:26px;background:rgba(255,255,255,.93);
      box-shadow:0 22px 60px rgba(11,26,60,.10)}
    .status{font-size:15px;line-height:1.5;color:var(--slate);margin-bottom:16px}
    .actions{display:grid;gap:10px}
    button,a.btn{border:0;text-decoration:none;border-radius:15px;padding:14px 18px;font-weight:850;font-size:15px;cursor:pointer}
    .primary{background:linear-gradient(135deg,var(--teal),var(--blue));color:#fff}
    .secondary{background:#fff;color:var(--navy);border:1px solid #dce7f5}
    .hint{margin-top:14px;font-size:12px;color:var(--slate);line-height:1.5}
    #iosHelp{display:none;margin-top:12px;padding:13px;border-radius:14px;background:var(--pale);font-size:13px;line-height:1.5;text-align:left}
  </style>
</head>
<body>
  <main class="shell">
    <img class="logo" src="./icon-512.png" alt="Op-Sym Orbit and Check logo">
    <h1>Op-Sym</h1>
    <div class="tag">Plan · Focus · Get things done</div>
    <section class="card">
      <div id="statusText" class="status">Install Op-Sym for Quick Capture and Android Share-to-Op-Sym.</div>
      <div class="actions">
        <button id="installBtn" class="primary" hidden>Install Op-Sym</button>
        <a class="btn primary" href="https://script.google.com/macros/s/AKfycbygTbX2omi_63Ricm2bDmbBzcwNuBXtKxJI2NpHIqvLCf051BiU06BTPkM-ufdbyQAXbA/exec?ui=mobile">Open Op-Sym</a>
        <button id="iosBtn" class="secondary" hidden>How to add on iPhone/iPad</button>
      </div>
      <div id="iosHelp">In Safari, tap <strong>Share</strong> → <strong>Add to Home Screen</strong> → <strong>Add</strong>.</div>
      <div class="hint">On supported Android/Chromium devices, installed Op-Sym can appear in the system Share sheet for text and links.</div>
    </section>
  </main>
<script>
const APP_URL="https://script.google.com/macros/s/AKfycbygTbX2omi_63Ricm2bDmbBzcwNuBXtKxJI2NpHIqvLCf051BiU06BTPkM-ufdbyQAXbA/exec";
let deferredPrompt=null;

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
}

const params=new URLSearchParams(location.search);
const shortcut=params.get('shortcut');
const isStandalone=window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true || params.get('source')==='pwa';
const isiOS=/iphone|ipad|ipod/i.test(navigator.userAgent);

window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferredPrompt=e;
  document.getElementById('installBtn').hidden=false;
  document.getElementById('statusText').textContent='Op-Sym is ready to install on this device.';
});

document.getElementById('installBtn').addEventListener('click',async()=>{
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt=null;
  document.getElementById('installBtn').hidden=true;
});

if(isiOS && !window.navigator.standalone){
  const b=document.getElementById('iosBtn'),h=document.getElementById('iosHelp');
  b.hidden=false;b.addEventListener('click',()=>h.style.display=h.style.display==='block'?'none':'block');
}

if(isStandalone){
  const u=new URL(APP_URL);
  u.searchParams.set('ui','mobile');
  if(shortcut==='capture'){
    u.searchParams.set('opsymCapture','quick');
    u.searchParams.set('opsymSource','PWA Shortcut');
  } else if(shortcut==='task'){
    u.searchParams.set('opsymLauncher','task');
  } else if(shortcut==='inbox'){
    u.searchParams.set('opsymView','inbox');
  }
  document.getElementById('statusText').textContent='Opening Op-Sym…';
  setTimeout(()=>location.replace(u.toString()),350);
}
</script>
</body>
</html>
